name: Make Release Builds
# NOTE: To enable GitHub Pages deployment, go to
# Settings > Pages > Source > GitHub Actions in the repository settings.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # NOTE: Linux, Windows, macOS, and create-release jobs are disabled.
  # Only WASM, Android, test-pages, and deploy-pages are active.
  # ────────────────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────────────────
  # WebAssembly (Emscripten)
  # ────────────────────────────────────────────────────────────────────────────
  build-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}

      - name: Install CMake and build essentials
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential python3

      # Cache Emscripten SDK to avoid re-downloading on every run (~2 min saved)
      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: /tmp/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: emsdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Emscripten SDK
        run: |
          if [ ! -f /tmp/emsdk/emsdk ]; then
            git clone --depth=1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
            /tmp/emsdk/emsdk install latest
          fi
          /tmp/emsdk/emsdk activate latest

      - name: Get WASM artifact name
        run: |
          source /tmp/emsdk/emsdk_env.sh
          echo "WASM_ARTIFACT_NAME=$(python3 build.py --emscripten --print-artifact-name)" >> $GITHUB_ENV

      - name: Build SDL3 for Emscripten
        run: |
          source /tmp/emsdk/emsdk_env.sh
          python3 build.py --emscripten --dependencies

      - name: Configure
        run: |
          source /tmp/emsdk/emsdk_env.sh
          python3 build.py --emscripten --configure

      - name: Build
        run: |
          source /tmp/emsdk/emsdk_env.sh
          python3 build.py --emscripten --build

      - name: Package
        run: |
          source /tmp/emsdk/emsdk_env.sh
          python3 build.py --emscripten --package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.WASM_ARTIFACT_NAME}}
          path: dist/
          compression-level: 0

      # Prepare GitHub Pages content (game files + landing page)
      - name: Prepare GitHub Pages content
        run: |
          mkdir -p /tmp/gh-pages

          # Copy all static assets from docs/ (landing page, .nojekyll, etc.)
          for f in docs/*; do
            cp -r "$f" /tmp/gh-pages/ 2>/dev/null || true
          done

          # Unzip WASM bundle into pages dir (overlays game files on top)
          unzip "dist/$WASM_ARTIFACT_NAME" -d /tmp/gh-pages-unzipped
          # The zip contains a subdirectory; copy its contents to the pages root
          find /tmp/gh-pages-unzipped -mindepth 2 -maxdepth 2 -type f -exec cp {} /tmp/gh-pages/ \;

          # Verify that the main game files were extracted
          ls /tmp/gh-pages/Bugdom2.html /tmp/gh-pages/Bugdom2.wasm /tmp/gh-pages/index.html

          echo "Site contents:"
          ls -lh /tmp/gh-pages/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/gh-pages

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy to GitHub Pages
  # ────────────────────────────────────────────────────────────────────────────
  deploy-pages:
    needs: build-wasm
    # Only deploy from the default branches; all other branches/PRs just build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4



  # ────────────────────────────────────────────────────────────────────────────
  # Playwright tests – validate GitHub Pages landing page
  # ────────────────────────────────────────────────────────────────────────────
  test-pages:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Android (NDK cross-compile check for arm64-v8a)
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SDL_VER: "3.2.8"
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}

      - name: Install CMake and build essentials
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential python3 wget

      - name: Download SDL3 source
        run: |
          wget -q "https://libsdl.org/release/SDL3-${SDL_VER}.tar.gz" -O /tmp/SDL3.tar.gz
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          echo "SDL_SRC=/tmp/SDL3-${SDL_VER}" >> $GITHUB_ENV

      - name: Find Android NDK
        run: |
          # GitHub Actions provides ANDROID_NDK_ROOT or ANDROID_NDK_LATEST_HOME
          NDK=${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}}
          echo "NDK=$NDK" >> $GITHUB_ENV
          ls "$NDK/build/cmake/android.toolchain.cmake"

      - name: Build SDL3 for Android arm64-v8a
        run: |
          cmake -S "$SDL_SRC" -B "$SDL_SRC/build-android" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DCMAKE_INSTALL_PREFIX="$SDL_SRC/install-android"
          cmake --build "$SDL_SRC/build-android" -j$(nproc)
          cmake --install "$SDL_SRC/build-android"

      - name: Cross-compile game for Android arm64-v8a
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON \
            -DSDL3_DIR="$SDL_SRC/install-android/lib/cmake/SDL3"
          cmake --build build-android -j$(nproc)
